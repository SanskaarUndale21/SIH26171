<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fusion Privacy Agent</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #fafafa;
        color: #1a1a1a;
      }
      body { display: flex; flex-direction: column; }

      header {
        padding: 12px 14px;
        border-bottom: 1px solid #e5e5e5;
        background: #fff;
        flex-shrink: 0;
      }
      header h1 { font-size: 14px; margin: 0; font-weight: 600; }
      header p { font-size: 11px; margin: 2px 0 0; color: #6b7280; }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg { max-width: 92%; font-size: 13px; line-height: 1.4; }
      .msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: #fff;
        padding: 8px 11px;
        border-radius: 12px 12px 2px 12px;
      }
      .msg.agent {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #e5e5e5;
        padding: 8px 11px;
        border-radius: 12px 12px 12px 2px;
      }
      .msg.error {
        align-self: flex-start;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        padding: 8px 11px;
        border-radius: 12px 12px 12px 2px;
      }
      .msg.system {
        align-self: center;
        color: #9ca3af;
        font-size: 11px;
      }

      .manifest-chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .manifest-chip {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        background: #f3f4f6;
        border: 1px solid #e5e5e5;
        border-radius: 999px;
        padding: 2px 8px;
        color: #374151;
      }
      .manifest-chip.low-conf { border-color: #fbbf24; color: #92400e; }

      details.action-detail { margin-top: 6px; }
      details.action-detail summary {
        cursor: pointer;
        font-size: 11px;
        color: #2563eb;
      }
      details.action-detail pre {
        font-size: 10px;
        background: #f8f8f8;
        padding: 6px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 4px 0 0;
      }

      #composer {
        border-top: 1px solid #e5e5e5;
        background: #fff;
        padding: 10px;
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: flex-end;
      }
      #goal {
        flex: 1;
        resize: none;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        max-height: 90px;
        min-height: 36px;
      }
      #goal:focus { outline: none; border-color: #2563eb; }
      #send {
        border: none;
        background: #2563eb;
        color: #fff;
        border-radius: 10px;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #send:disabled { background: #93c5fd; cursor: default; }
      #send:hover:not(:disabled) { background: #1d4ed8; }

      #mic {
        border: 1px solid #d1d5db;
        background: #fff;
        border-radius: 10px;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #mic.listening { background: #fee2e2; border-color: #ef4444; animation: pulse 1s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

      #voiceToggle {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        color: #6b7280;
        padding: 2px 4px;
      }
      #voiceToggle.off { text-decoration: line-through; opacity: 0.5; }
      #clearVault {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        color: #6b7280;
        padding: 2px 4px;
      }
      header { display: flex; align-items: flex-start; justify-content: space-between; }

      .server-status { font-size: 10px; margin-top: 4px; display: inline-flex; align-items: center; gap: 5px; color: #6b7280; }
      .server-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
      .server-status.ok::before { background: #16a34a; }
      .server-status.warn { color: #b45309; }
      .server-status.warn::before { background: #f59e0b; }
      .server-status.down { color: #b91c1c; }
      .server-status.down::before { background: #ef4444; }

      .metrics { margin-top: 6px; font-size: 11px; font-family: ui-monospace, monospace; color: #1f2937; }
      .metrics.sub { margin-top: 2px; font-size: 10px; color: #6b7280; }

      .from-jarvis { font-size: 10px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }

      .msg.summary {
        align-self: stretch;
        max-width: 100%;
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 12px;
        padding: 10px 12px;
      }
      .summary-title { font-size: 12px; font-weight: 600; color: #0c4a6e; margin-bottom: 8px; }
      .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
      .summary-grid div { display: flex; flex-direction: column; }
      .summary-grid b { font-size: 14px; color: #0f172a; }
      .summary-grid span { font-size: 10px; color: #64748b; }
      header .title-block { flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <div class="title-block">
        <h1>Fusion Privacy Agent</h1>
        <p>PII is redacted on-device before anything is sent</p>
        <div id="serverStatus" class="server-status">Checking server...</div>
      </div>
      <button id="voiceToggle" title="Toggle spoken responses">&#128266; voice</button>
      <button id="clearVault" title="Forget saved form answers (name, company, etc.)">&#128465;</button>
    </header>
    <div id="messages"></div>
    <div id="composer">
      <button id="mic" title="Speak your task">&#127908;</button>
      <textarea id="goal" placeholder="Tell it what to do, or press the mic..." rows="1"></textarea>
      <button id="send" title="Run task">&#8593;</button>
    </div>
    <script type="module" src="./src/sidepanel/sidepanel.ts"></script>
  </body>
</html>
