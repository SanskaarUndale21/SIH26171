<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fusion Privacy Agent</title>
    <link rel="stylesheet" href="./src/sidepanel/sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="8" class="glyph-bg" />
          <rect x="8" y="10" width="16" height="4" rx="1" class="glyph-line" />
          <rect x="8" y="18" width="11" height="4" rx="1" class="glyph-mask" />
        </svg>
        <div>
          <h1>Fusion Privacy Agent</h1>
          <p id="serverStatus" class="server" data-state="checking">Checking the planner server</p>
        </div>
      </div>
      <div class="tools">
        <button id="voiceToggle" class="icon" aria-pressed="true" title="Read progress aloud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" /><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" /></svg>
          <span class="sr">Read progress aloud</span>
        </button>
        <button id="clearVault" class="icon" title="Forget saved answers">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></svg>
          <span class="sr">Forget saved answers</span>
        </button>
      </div>
    </header>

    <main id="messages" aria-live="polite"></main>

    <form id="composer">
      <button type="button" id="mic" class="icon" title="Speak your task (transcribed on this device)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
        <span class="sr">Speak your task</span>
      </button>
      <label class="sr" for="goal">What should it do on this page?</label>
      <textarea id="goal" rows="1" placeholder="What should it do on this page?"></textarea>
      <button type="submit" id="send" title="Run">
        <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" /></svg>
        <span class="sr" id="sendLabel">Run</span>
      </button>
    </form>

    <script type="module" src="./src/sidepanel/sidepanel.ts"></script>
  </body>
</html>
