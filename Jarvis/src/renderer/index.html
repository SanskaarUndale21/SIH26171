<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="8" class="glyph-bg" />
        <rect x="8" y="10" width="16" height="4" rx="1" class="glyph-line" />
        <rect x="8" y="18" width="11" height="4" rx="1" class="glyph-mask" />
      </svg>
      <div>
        <div class="name">Jarvis</div>
        <div class="status" id="status"><span id="statusText">Ready</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="speak" title="Read replies aloud" aria-label="Read replies aloud" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="icon-btn" id="newChat" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button class="icon-btn" id="hide" title="Hide (Ctrl+Shift+J)" aria-label="Hide">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
    </div>
  </header>

  <main id="log" aria-live="polite">
    <div class="empty" id="empty">
      <p class="lede">Ask by typing or with the mic. Your voice, your screen and your personal details are handled on this computer first.</p>
      <ul class="legend">
        <li><span class="swatch local"></span>Done on this computer</li>
        <li><span class="swatch remote"></span>Sent out, or waiting for your OK</li>
        <li><span class="mask static">email</span>Masked before anything is sent</li>
      </ul>
      <p class="try">Try one of these</p>
      <div class="chips">
        <button class="chip">Fill in the scholarship form in Chrome. My email is priya.sharma@example.org</button>
        <button class="chip">What's on my screen right now?</button>
        <button class="chip">What's using the most disk space in Downloads?</button>
        <button class="chip">Summarise what's on my clipboard</button>
      </div>
    </div>
  </main>

  <form id="composer">
    <button type="button" id="micBtn" title="Click to talk, click again to stop. Transcribed on this computer." aria-label="Voice input">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <label class="sr" for="input">Message Jarvis</label>
    <textarea id="input" rows="1" placeholder="Ask Jarvis" autocomplete="off"></textarea>
    <button type="submit" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>

  <section id="settings" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <label>Model endpoint
        <input id="cfgBase" type="url" spellcheck="false" />
        <span class="help">Any OpenAI-compatible address. The default is the SIH server, which holds the key.</span>
      </label>
      <label>SIH server
        <input id="cfgHub" type="url" spellcheck="false" />
        <span class="help">Used to hand tasks to the browser extension.</span>
      </label>
      <label>Model
        <input id="cfgModel" type="text" spellcheck="false" />
      </label>
      <label>API key
        <input id="cfgKey" type="password" spellcheck="false" />
        <span class="help">Stored encrypted on this computer and never shown again.</span>
      </label>
      <label class="check">
        <input id="cfgAuto" type="checkbox" />
        <span>Open links and use the clipboard without asking</span>
      </label>
      <div class="row">
        <button type="button" class="ghost" id="cfgCancel">Cancel</button>
        <button type="button" class="primary" id="cfgSave">Save settings</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
